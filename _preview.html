<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>preview harness</title>
<style>
  html,body{margin:0;background:#15161b}
  body{display:flex;gap:14px;padding:14px;align-items:flex-start}
  figure{margin:0}
  iframe{width:390px;height:844px;border:0;border-radius:20px;display:block;background:#07080c}
  figcaption{color:#7f8a99;font:11px/1.4 system-ui,sans-serif;text-align:center;padding-top:6px}
</style>
</head>
<body>
  <figure><iframe data-src="./?cb=pa" data-y="0"></iframe><figcaption>1 · top</figcaption></figure>
  <figure><iframe data-src="./?cb=pb" data-y="1160"></iframe><figcaption>2 · color · point</figcaption></figure>
  <figure><iframe data-src="./?cb=pc" data-y="1820"></iframe><figcaption>3 · icon</figcaption></figure>
  <figure><iframe data-src="./?cb=pd&demo=1" data-done="1"></iframe><figcaption>4 · done</figcaption></figure>
<script>
  document.querySelectorAll('iframe').forEach(f => {
    f.addEventListener('load', () => {
      const w = f.contentWindow;
      try {
        if (f.dataset.done) {
          w.fetch = () => Promise.resolve({ ok: true });
          setTimeout(() => {
            const b = w.document.getElementById('submitBtn');
            if (b) b.click();
          }, 1600);
        } else {
          setTimeout(() => w.scrollTo(0, +f.dataset.y || 0), 1200);
        }
      } catch (e) {}
    });
    const sep = f.dataset.src.indexOf('?') >= 0 ? '&' : '?';
    f.src = f.dataset.src + sep + '_=' + Date.now();
  });
</script>
</body>
</html>
